seta sv_hostname "quakejs"
seta sv_maxclients 12
// Snapshot rate. At the ioq3 default of 20 the server updates clients only
// every 50ms, which reads as ~50ms of ping even on a local server. 40 halves
// that and measured cheaper here, because the loop spends less time waiting.
seta sv_fps 40
seta g_motd "Welcome to the Local baseq3 QuakeJS Server"
seta g_quadfactor 3
seta g_gametype 0
seta timelimit 10
seta fraglimit 20
seta g_weaponrespawn 3
seta g_inactivity 3000
seta g_forcerespawn 0
seta rconpassword ""
// The stock demo maps plus the pro-* versions the point release adds.
set d1 "map q3dm1 ; set nextmap vstr d2"
set d2 "map q3dm7 ; set nextmap vstr d3"
set d3 "map q3dm17 ; set nextmap vstr d4"
set d4 "map pro-q3tourney2 ; set nextmap vstr d5"
set d5 "map pro-q3tourney4 ; set nextmap vstr d6"
set d6 "map pro-q3dm6 ; set nextmap vstr d7"
set d7 "map pro-q3dm13 ; set nextmap vstr d8"
set d8 "map q3tourney2 ; set nextmap vstr d1"
vstr d1
